<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rompecabezas del Dr. Iturriaga: Renato Iturriaga</title>
<style>
:root{
  --bg:#FFF3DC; --card:#FFFFFF; --ink:#2B1A10; --muted:#6B5646; --accent:#6A1B9A; --orange:#E65100; --line:#E8C9A0; --slot:#F6E2BC; --btnfg:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1E0F2E;--card:#2D1745;--ink:#FFF3DC;--muted:#CDB8E0;--accent:#F9B8FF;--orange:#FFA94D;--line:#5A3A7A;--slot:#3A2058;--btnfg:#1E0F2E}
}
:root[data-theme="dark"]{--bg:#1E0F2E;--card:#2D1745;--ink:#FFF3DC;--muted:#CDB8E0;--accent:#F9B8FF;--orange:#FFA94D;--line:#5A3A7A;--slot:#3A2058;--btnfg:#1E0F2E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:14px 14px 28px}
.banner{text-align:center;font-size:24px;letter-spacing:4px;overflow:hidden;white-space:nowrap}
h1{font-family:Georgia,"Times New Roman",serif;color:var(--accent);text-align:center;margin:4px 0 2px;font-size:27px}
.sub{text-align:center;color:var(--muted);margin:0 0 12px}
.bar{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:600}
.bar span{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 12px;flex:1;text-align:center}
.board{position:relative;width:100%;aspect-ratio:1;background:var(--slot);border:3px solid var(--orange);border-radius:14px;overflow:hidden;touch-action:manipulation}
.tile{position:absolute;border:0;padding:0;margin:0;cursor:pointer;background-repeat:no-repeat;outline:1px solid rgba(0,0,0,.35);outline-offset:-1px;transition:left .15s,top .15s}
.tile:focus-visible{outline:3px solid var(--accent);z-index:2}
.tile.empty{visibility:hidden}
.tile .n{position:absolute;left:4px;top:2px;font:700 13px Arial,sans-serif;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:0 5px;display:none}
.shownum .tile .n{display:block}
.peek{position:absolute;inset:0;z-index:5;background-size:cover;display:none;pointer-events:none}
.board.peeking .peek{display:block}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
